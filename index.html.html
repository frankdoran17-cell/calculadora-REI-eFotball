<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora REI - eFootball</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e24;
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .calculator-container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            border-top: 4px solid var(--primary);
        }

        h2 {
            margin-top: 0;
            text-align: center;
            background: -webkit-linear-gradient(left, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 24px;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background-color: #2a2a35;
            border: 1px solid #3d3d4e;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .result-box {
            margin-top: 30px;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }

        .result-box span {
            display: block;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .result-box .score {
            font-size: 42px;
            font-weight: bold;
            margin: 0;
        }

        .category {
            margin-top: 10px;
            font-size: 16px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="calculator-container">
        <h2>Calculadora REI</h2>
        <p class="subtitle">Rapidez Efectiva Inercial</p>

        <div class="input-group">
            <label for="velocidad">Velocidad (Stat)</label>
            <input type="number" id="velocidad" placeholder="Ej. 90" value="90" oninput="calcularREI()">
        </div>

        <div class="input-group">
            <label for="aceleracion">Aceleración (Stat)</label>
            <input type="number" id="aceleracion" placeholder="Ej. 85" value="85" oninput="calcularREI()">
        </div>

        <div class="input-group">
            <label for="altura">Altura (cm)</label>
            <input type="number" id="altura" placeholder="Ej. 180" value="180" oninput="calcularREI()">
        </div>

        <div class="input-group">
            <label for="peso">Peso (kg)</label>
            <input type="number" id="peso" placeholder="Ej. 75" value="75" oninput="calcularREI()">
        </div>

        <div class="result-box">
            <span>Puntos de Rapidez</span>
            <div class="score" id="resultado">0.00</div>
            <div class="category" id="categoria">-</div>
        </div>
    </div>

    <script>
        function calcularREI() {
            // Obtener valores de los inputs
            const V = parseFloat(document.getElementById('velocidad').value) || 0;
            const A = parseFloat(document.getElementById('aceleracion').value) || 0;
            const H = parseFloat(document.getElementById('altura').value) || 0;
            const W = parseFloat(document.getElementById('peso').value) || 0;

            const resultadoDiv = document.getElementById('resultado');
            const categoriaDiv = document.getElementById('categoria');

            // Validar que peso y altura sean mayores a 0 para evitar errores matemáticos
            if (W <= 0 || H <= 0) {
                resultadoDiv.innerText = "--";
                categoriaDiv.innerText = "Datos incompletos";
                return;
            }

            // Aplicar la fórmula: REI = [ (V * 0.6) + ( A * (75/W)^0.2 * 0.4 ) ] * (H/175)^0.15
            const factorInercia = Math.pow(75 / W, 0.2);
            const factorZancada = Math.pow(H / 175, 0.15);
            
            const componenteVelocidad = V * 0.6;
            const componenteAceleracion = A * factorInercia * 0.4;
            
            let rei = (componenteVelocidad + componenteAceleracion) * factorZancada;

            // Mostrar el resultado con 2 decimales
            resultadoDiv.innerText = rei.toFixed(2);

            // Asignar categoría basada en el resultado
            if (rei >= 95) {
                categoriaDiv.innerText = "Élite Supersónico ⚡";
            } else if (rei >= 85) {
                categoriaDiv.innerText = "Velocista de Élite 🏃‍♂️";
            } else if (rei >= 75) {
                categoriaDiv.innerText = "Rapidez Competitiva ⚽";
            } else {
                categoriaDiv.innerText = "Baja Reactividad 🐢";
            }
        }

        // Ejecutar la función una vez al cargar la página para mostrar el valor inicial
        window.onload = calcularREI;
    </script>
</body>
</html>
